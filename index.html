<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BestDeal – Compare Prices & Save</title>

<meta name="description"
content="BestDeal helps you compare product prices and find better deals across online stores.">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f6f8;
    color:#222;
}

header{
    background:#111827;
    color:white;
    padding:18px 15px;
    text-align:center;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.tagline{
    margin-top:5px;
    font-size:14px;
    color:#d1d5db;
}

.search-area{
    padding:20px 15px;
    background:white;
    text-align:center;
}

.search-box{
    width:100%;
    max-width:600px;
    padding:14px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

.search-box:focus{
    border-color:#2563eb;
}

.categories{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:15px;
    background:white;
}

.category{
    flex:0 0 auto;
    padding:10px 16px;
    border-radius:20px;
    background:#e5e7eb;
    cursor:pointer;
    font-size:14px;
}

.category.active{
    background:#111827;
    color:white;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px 15px;
}

.status{
    text-align:center;
    padding:20px;
    color:#555;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:14px;
    padding:15px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
}

.card img{
    width:100%;
    height:200px;
    object-fit:contain;
    border-radius:10px;
    background:#f3f4f6;
}

.card h3{
    margin:12px 0 8px;
    font-size:18px;
}

.category-name{
    font-size:13px;
    color:#777;
    margin-bottom:10px;
}

.best-price{
    font-size:22px;
    font-weight:bold;
    margin:8px 0;
}

.best-store{
    font-size:14px;
    color:#15803d;
    margin-bottom:12px;
}

.store{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-top:1px solid #eee;
    padding:10px 0;
}

.store-name{
    font-weight:bold;
}

.store-price{
    font-weight:bold;
}

.buy-btn{
    display:inline-block;
    margin-top:5px;
    padding:8px 12px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:7px;
    font-size:13px;
}

.compare-btn{
    width:100%;
    margin-top:12px;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#f59e0b;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.compare-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#111827;
    color:white;
    padding:15px;
    display:none;
    text-align:center;
    z-index:1000;
}

.compare-bar button{
    margin-left:10px;
    padding:8px 15px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

footer{
    margin-top:40px;
    background:#111827;
    color:#ccc;
    text-align:center;
    padding:25px 15px;
    font-size:13px;
}

.error{
    color:#dc2626;
}

@media(max-width:600px){

    .products{
        grid-template-columns:1fr;
    }

    .card img{
        height:220px;
    }

    .compare-bar{
        font-size:14px;
    }

    .compare-bar button{
        margin-top:5px;
    }

}

</style>
</head>

<body>

<header>

    <div class="logo">
        BestDeal
    </div>

    <div class="tagline">
        Compare. Save. Buy Better.
    </div>

</header>


<div class="search-area">

    <input
        type="text"
        id="searchBox"
        class="search-box"
        placeholder="Search products..."
        oninput="filterProducts()"
    >

</div>


<div class="categories" id="categories">

    <div
        class="category active"
        onclick="selectCategory('All',this)"
    >
        All
    </div>

    <div
        class="category"
        onclick="selectCategory('Mobile',this)"
    >
        📱 Mobile
    </div>

    <div
        class="category"
        onclick="selectCategory('Laptop',this)"
    >
        💻 Laptops
    </div>

    <div
        class="category"
        onclick="selectCategory('TV',this)"
    >
        📺 TVs
    </div>

    <div
        class="category"
        onclick="selectCategory('Audio',this)"
    >
        🎧 Audio
    </div>

    <div
        class="category"
        onclick="selectCategory('Appliances',this)"
    >
        🏠 Appliances
    </div>

    <div
        class="category"
        onclick="selectCategory('Bikes',this)"
    >
        🏍️ Bikes
    </div>

</div>


<div class="container">

    <div id="status" class="status">
        Loading products...
    </div>

    <div id="products" class="products"></div>

</div>


<div id="compareBar" class="compare-bar">

    <span id="compareText">
        0 products selected
    </span>

    <button onclick="showCompare()">
        Compare
    </button>

    <button onclick="clearCompare()">
        Clear
    </button>

</div>


<footer>

    <p>© 2026 BestDeal</p>

    <p>
        Compare. Save. Buy Better.
    </p>

</footer>


<script>

/* ==========================================
   BESTDEAL API
========================================== */

const API_URL =
"https://bestdeal-api.deepakmahatobist.workers.dev";


/* ==========================================
   VARIABLES
========================================== */

let allProducts = [];

let currentCategory = "All";

let selectedProducts = [];


/* ==========================================
   LOAD PRODUCTS FROM CLOUDFLARE API
========================================== */

async function loadProducts(){

    const status =
        document.getElementById("status");

    try{

        const response =
            await fetch(API_URL + "/api/products");

        if(!response.ok){

            throw new Error(
                "API request failed"
            );

        }

        const data =
            await response.json();


        if(!data.success){

            throw new Error(
                "API returned an error"
            );

        }


        /*
         Convert D1 database format
         into frontend format
        */

        allProducts =
            data.products.map(product => {

                const stores = [];


                if(
                    product.amazon_price !== null &&
                    product.amazon_price !== undefined
                ){

                    stores.push({

                        name:"Amazon",

                        price:Number(
                            product.amazon_price
                        ),

                        url:
                            product.amazon_url ||
                            "https://www.amazon.in/"

                    });

                }


                if(
                    product.flipkart_price !== null &&
                    product.flipkart_price !== undefined
                ){

                    stores.push({

                        name:"Flipkart",

                        price:Number(
                            product.flipkart_price
                        ),

                        url:
                            product.flipkart_url ||
                            "https://www.flipkart.com/"

                    });

                }


                return {

                    id:String(product.id),

                    name:product.name,

                    category:product.category || "Other",

                    image:
                        product.image_url ||
                        "https://via.placeholder.com/300",

                    stores:stores

                };

            });


        status.style.display = "none";


        displayProducts(allProducts);


    }catch(error){

        console.error(error);


        status.innerHTML =
            '<div class="error">' +
            '❌ Unable to connect to BestDeal API.' +
            '<br><br>' +
            'Please check the Cloudflare Worker.' +
            '</div>';

    }

}


/* ==========================================
   DISPLAY PRODUCTS
========================================== */

function displayProducts(products){

    const container =
        document.getElementById("products");


    container.innerHTML = "";


    if(products.length === 0){

        container.innerHTML =
            "<div style='text-align:center;width:100%;padding:30px'>" +
            "No products found." +
            "</div>";

        return;

    }


    products.forEach(product => {


        /*
         If product has no store prices
        */

        if(
            !product.stores ||
            product.stores.length === 0
        ){

            return;

        }


        /*
         Find cheapest store
        */

        const cheapestStore =
            product.stores.reduce(
                (lowest,current) =>
                    current.price < lowest.price
                    ? current
                    : lowest
            );


        /*
         Create store rows
        */

        let storesHTML = "";


        product.stores.forEach(store => {

            storesHTML += `

                <div class="store">

                    <div>

                        <div class="store-name">
                            ${store.name}
                        </div>

                        <div class="store-price">
                            ₹${store.price.toLocaleString("en-IN")}
                        </div>

                    </div>


                    <a
                        href="${store.url}"
                        class="buy-btn"
                        target="_blank"
                        rel="noopener"
                    >
                        Buy
                    </a>

                </div>

            `;

        });


        /*
         Check if product is selected
        */

        const isSelected =
            selectedProducts.some(
                p => p.id === product.id
            );


        /*
         Create card
        */

        const card =
            document.createElement("div");


        card.className = "card";


        card.innerHTML = `

            <img
                src="${product.image}"
                alt="${product.name}"
                onerror="this.src='https://via.placeholder.com/300'"
            >


            <div class="category-name">
                ${product.category}
            </div>


            <h3>
                ${product.name}
            </h3>


            <div class="best-price">
                ₹${cheapestStore.price.toLocaleString("en-IN")}
            </div>


            <div class="best-store">
                Best price at ${cheapestStore.name}
            </div>


            ${storesHTML}


            <button
                class="compare-btn"
                onclick="toggleCompare('${product.id}')"
            >
                ${
                    isSelected
                    ? "✓ Added to Compare"
                    : "Add to Compare"
                }
            </button>

        `;


        container.appendChild(card);

    });

}


/* ==========================================
   CATEGORY
========================================== */

function selectCategory(
    category,
    element
){

    currentCategory =
        category;


    document
        .querySelectorAll(".category")
        .forEach(button =>
            button.classList.remove("active")
        );


    element.classList.add("active");


    filterProducts();

}


/* ==========================================
   SEARCH + CATEGORY FILTER
========================================== */

function filterProducts(){

    const search =
        document
            .getElementById("searchBox")
            .value
            .toLowerCase()
            .trim();


    const filtered =
        allProducts.filter(product => {


            const productCategory =
                product.category
                    .toLowerCase();


            /*
             Treat Laptops button
             as Laptop category
            */

            const matchesCategory =
                currentCategory === "All" ||
                productCategory ===
                currentCategory.toLowerCase();


            const matchesSearch =
                product.name
                    .toLowerCase()
                    .includes(search)

                ||

                productCategory
                    .includes(search);


            return (
                matchesCategory &&
                matchesSearch
            );

        });


    displayProducts(filtered);

}


/* ==========================================
   COMPARE
========================================== */

function toggleCompare(productId){

    const product =
        allProducts.find(
            p => p.id === productId
        );


    if(!product){

        return;

    }


    const existing =
        selectedProducts.findIndex(
            p => p.id === productId
        );


    if(existing >= 0){

        selectedProducts.splice(
            existing,
            1
        );

    }else{


        if(selectedProducts.length >= 3){

            alert(
                "You can compare maximum 3 products."
            );

            return;

        }


        selectedProducts.push(product);

    }


    updateCompareBar();


    filterProducts();

}


/* ==========================================
   COMPARE BAR
========================================== */

function updateCompareBar(){

    const bar =
        document.getElementById(
            "compareBar"
        );


    const text =
        document.getElementById(
            "compareText"
        );


    if(selectedProducts.length === 0){

        bar.style.display =
            "none";

    }else{

        bar.style.display =
            "block";


        text.innerText =
            selectedProducts.length +
            " product" +
            (
                selectedProducts.length > 1
                ? "s"
                : ""
            ) +
            " selected";

    }

}


/* ==========================================
   SHOW COMPARE
========================================== */

function showCompare(){

    if(selectedProducts.length < 2){

        alert(
            "Please select at least 2 products."
        );

        return;

    }


    let message =
        "BESTDEAL COMPARISON\n\n";


    selectedProducts.forEach(product => {


        const cheapestStore =
            product.stores.reduce(
                (lowest,current) =>
                    current.price < lowest.price
                    ? current
                    : lowest
            );


        message +=
            product.name +
            "\nBest Price: ₹" +
            cheapestStore.price.toLocaleString("en-IN") +
            "\nStore: " +
            cheapestStore.name +
            "\n\n";

    });


    alert(message);

}


/* ==========================================
   CLEAR COMPARE
========================================== */

function clearCompare(){

    selectedProducts = [];


    updateCompareBar();


    filterProducts();

}


/* ==========================================
   START APP
========================================== */

loadProducts();

</script>

</body>
</html>
