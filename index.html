<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BestDeal – Compare Prices & Save</title>

<meta name="description"
      content="BestDeal helps you compare product prices and find better deals across online stores.">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f6f8;
    color:#222;
}

/* HEADER */

header{
    background:#111827;
    color:white;
    padding:20px 15px;
    text-align:center;
}

.logo{
    font-size:32px;
    font-weight:bold;
}

.tagline{
    margin-top:5px;
    font-size:14px;
    color:#d1d5db;
}

/* SEARCH */

.search-area{
    padding:20px 15px;
    background:white;
    text-align:center;
}

.search-box{
    width:100%;
    max-width:600px;
    padding:15px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

.search-box:focus{
    border-color:#2563eb;
}

/* CATEGORIES */

.categories{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:15px;
    background:white;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    flex:0 0 auto;
    padding:10px 16px;
    border-radius:20px;
    background:#e5e7eb;
    cursor:pointer;
    font-size:14px;
    border:none;
}

.category.active{
    background:#111827;
    color:white;
}

/* CONTAINER */

.container{
    max-width:1100px;
    margin:auto;
    padding:20px 15px;
}

.status{
    text-align:center;
    padding:20px;
    color:#555;
}

/* PRODUCTS */

.products{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

/* CARD */

.card{
    background:white;
    border-radius:14px;
    padding:15px;
    box-shadow:
        0 3px 12px rgba(0,0,0,0.08);
}

.card img{
    width:100%;
    height:200px;
    object-fit:contain;
    border-radius:10px;
    background:#f3f4f6;
}

.card h3{
    margin:12px 0 8px;
    font-size:18px;
}

.category-name{
    font-size:13px;
    color:#777;
    margin-bottom:10px;
}

.best-price{
    font-size:22px;
    font-weight:bold;
    margin:8px 0;
}

.best-store{
    font-size:14px;
    color:#15803d;
    margin-bottom:12px;
}

/* STORE */

.store{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-top:1px solid #eee;
    padding:10px 0;
}

.store-name{
    font-weight:bold;
}

.store-price{
    font-weight:bold;
}

/* BUY BUTTON */

.buy-btn{
    display:inline-block;
    margin-top:5px;
    padding:8px 12px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:7px;
    font-size:13px;
}

/* COMPARE BUTTON */

.compare-btn{
    width:100%;
    margin-top:12px;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#f59e0b;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* COMPARE BAR */

.compare-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#111827;
    color:white;
    padding:15px;
    display:none;
    text-align:center;
    z-index:1000;
}

.compare-bar button{
    margin-left:10px;
    padding:8px 15px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

/* FOOTER */

footer{
    margin-top:40px;
    background:#111827;
    color:#ccc;
    text-align:center;
    padding:25px 15px;
    font-size:13px;
}

.error{
    color:#dc2626;
}

/* MOBILE */

@media(max-width:600px){

    .products{
        grid-template-columns:1fr;
    }

    .card img{
        height:220px;
    }

    .compare-bar{
        font-size:14px;
    }

    .compare-bar button{
        margin-top:5px;
    }

}

</style>

</head>

<body>

<!-- HEADER -->

<header>

    <div class="logo">
        BestDeal
    </div>

    <div class="tagline">
        Compare. Save. Buy Better.
    </div>

</header>


<!-- SEARCH -->

<div class="search-area">

    <input
        type="text"
        id="searchBox"
        class="search-box"
        placeholder="Search products..."
        oninput="filterProducts()"
    >

</div>


<!-- DYNAMIC CATEGORIES -->

<div
    id="categories"
    class="categories">

    <button
        class="category active"
        onclick="selectCategory('All',this)">
        All
    </button>

</div>


<!-- PRODUCTS -->

<div class="container">

    <div id="status"
         class="status">
        Loading products...
    </div>

    <div id="products"
         class="products">
    </div>

</div>


<!-- COMPARE BAR -->

<div id="compareBar"
     class="compare-bar">

    <span id="compareText">
        0 products selected
    </span>

    <button onclick="showCompare()">
        Compare
    </button>

    <button onclick="clearCompare()">
        Clear
    </button>

</div>


<!-- FOOTER -->

<footer>

    <p>© 2026 BestDeal</p>

    <p>
        Compare. Save. Buy Better.
    </p>

</footer>


<script>

/* =========================================
   CLOUDFLARE WORKER
========================================= */

const API_URL =
"https://bestdeal-api.deepakmahatobist.workers.dev";


/* =========================================
   VARIABLES
========================================= */

let allProducts = [];

let currentCategory = "All";

let selectedProducts = [];

let searchTimer = null;


/* =========================================
   CONVERT API PRODUCT
========================================= */

function convertProduct(product){

    const stores = [];


    /* AMAZON */

    if(
        product.amazon_price !== null &&
        product.amazon_price !== undefined &&
        Number(product.amazon_price) > 0
    ){

        stores.push({

            name:"Amazon",

            price:Number(
                product.amazon_price
            ),

            url:
                product.amazon_url ||
                "https://www.amazon.in/"

        });

    }


    /* FLIPKART */

    if(
        product.flipkart_price !== null &&
        product.flipkart_price !== undefined &&
        Number(product.flipkart_price) > 0
    ){

        stores.push({

            name:"Flipkart",

            price:Number(
                product.flipkart_price
            ),

            url:
                product.flipkart_url ||
                "https://www.flipkart.com/"

        });

    }


    return {

        id:String(product.id),

        name:product.name || "Unnamed Product",

        category:
            product.category ||
            "Other",

        image:
            product.image_url ||
            "https://via.placeholder.com/300",

        stores:stores

    };

}


/* =========================================
   LOAD ALL PRODUCTS
========================================= */

async function loadProducts(){

    const status =
        document.getElementById("status");


    try{

        const response =
            await fetch(
                API_URL +
                "/api/products"
            );


        if(!response.ok){

            throw new Error(
                "API request failed"
            );

        }


        const data =
            await response.json();


        if(!data.success){

            throw new Error(
                "API returned error"
            );

        }


        allProducts =
            data.products.map(
                convertProduct
            );


        /* CREATE CATEGORIES */

        buildCategories();


        status.style.display =
            "none";


        displayProducts(
            allProducts
        );


    }catch(error){

        console.error(error);


        status.innerHTML =
            '<div class="error">' +
            '❌ Unable to connect to BestDeal API.' +
            '<br><br>' +
            'Please check your Cloudflare Worker.' +
            '</div>';

    }

}


/* =========================================
   BUILD DYNAMIC CATEGORIES
========================================= */

function buildCategories(){

    const container =
        document.getElementById(
            "categories"
        );


    container.innerHTML = "";


    /* ALL BUTTON */

    const allButton =
        document.createElement(
            "button"
        );


    allButton.className =
        "category active";


    allButton.innerText =
        "All";


    allButton.onclick =
        function(){

            selectCategory(
                "All",
                this
            );

        };


    container.appendChild(
        allButton
    );


    /* FIND UNIQUE CATEGORIES */

    const categorySet =
        new Set();


    allProducts.forEach(
        product => {

            if(
                product.category
            ){

                categorySet.add(
                    product.category
                );

            }

        }
    );


    const categories =
        Array.from(
            categorySet
        ).sort();


    /* CREATE BUTTONS */

    categories.forEach(
        category => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "category";


            button.innerText =
                category;


            button.onclick =
                function(){

                    selectCategory(
                        category,
                        this
                    );

                };


            container.appendChild(
                button
            );

        }
    );

}


/* =========================================
   DISPLAY PRODUCTS
========================================= */

function displayProducts(products){

    const container =
        document.getElementById(
            "products"
        );


    container.innerHTML = "";


    if(products.length === 0){

        container.innerHTML =
            "<div style='text-align:center;" +
            "width:100%;padding:30px'>" +
            "No products found." +
            "</div>";

        return;

    }


    products.forEach(product => {


        if(
            !product.stores ||
            product.stores.length === 0
        ){

            return;

        }


        /* FIND CHEAPEST STORE */

        const cheapestStore =
            product.stores.reduce(
                (lowest,current) =>
                    current.price < lowest.price
                    ? current
                    : lowest
            );


        /* STORE HTML */

        let storesHTML = "";


        product.stores.forEach(
            store => {

                storesHTML += `

                    <div class="store">

                        <div>

                            <div class="store-name">
                                ${store.name}
                            </div>

                            <div class="store-price">
                                ₹${store.price.toLocaleString("en-IN")}
                            </div>

                        </div>

                        <a
                            href="${store.url}"
                            class="buy-btn"
                            target="_blank"
                            rel="noopener noreferrer">
                            Buy
                        </a>

                    </div>

                `;

            }
        );


        /* CHECK SELECTED */

        const isSelected =
            selectedProducts.some(
                p =>
                    p.id === product.id
            );


        /* CREATE CARD */

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "card";


        card.innerHTML = `

            <img
                src="${product.image}"
                alt="${product.name}"
                onerror="this.src='https://via.placeholder.com/300'"
            >

            <div class="category-name">
                ${product.category}
            </div>

            <h3>
                ${product.name}
            </h3>

            <div class="best-price">
                ₹${cheapestStore.price.toLocaleString("en-IN")}
            </div>

            <div class="best-store">
                Best price at ${cheapestStore.name}
            </div>

            ${storesHTML}

            <button
                class="compare-btn"
                onclick="toggleCompare('${product.id}')">

                ${
                    isSelected
                    ? "✓ Added to Compare"
                    : "Add to Compare"
                }

            </button>

        `;


        container.appendChild(card);

    });

}


/* =========================================
   CATEGORY SELECT
========================================= */

function selectCategory(
    category,
    element
){

    currentCategory =
        category;


    document
        .querySelectorAll(".category")
        .forEach(button =>
            button.classList.remove(
                "active"
            )
        );


    element.classList.add(
        "active"
    );


    /*
       Do NOT clear search.
       Search + category can work together.
    */

    applyFilters();

}


/* =========================================
   SEARCH
========================================= */

function filterProducts(){

    clearTimeout(
        searchTimer
    );


    searchTimer =
        setTimeout(
            performSearch,
            350
        );

}


/* =========================================
   SEARCH
========================================= */

async function performSearch(){

    const search =
        document
            .getElementById(
                "searchBox"
            )
            .value
            .trim();


    /* EMPTY SEARCH */

    if(search === ""){

        applyFilters();

        return;

    }


    const status =
        document.getElementById(
            "status"
        );


    status.style.display =
        "block";


    status.innerHTML =
        "🔎 Searching...";


    try{

        const response =
            await fetch(
                API_URL +
                "/api/search?q=" +
                encodeURIComponent(
                    search
                )
            );


        if(!response.ok){

            throw new Error(
                "Search request failed"
            );

        }


        const data =
            await response.json();


        if(!data.success){

            throw new Error(
                "Search failed"
            );

        }


        let results =
            data.products.map(
                convertProduct
            );


        /* CATEGORY FILTER */

        if(
            currentCategory !==
            "All"
        ){

            results =
                results.filter(
                    product =>
                        product.category
                            .toLowerCase() ===
                        currentCategory
                            .toLowerCase()
                );

        }


        status.style.display =
            "none";


        displayProducts(
            results
        );


    }catch(error){

        console.error(error);


        status.innerHTML =
            '<div class="error">' +
            '❌ Search failed.' +
            '</div>';

    }

}


/* =========================================
   APPLY LOCAL FILTERS
========================================= */

function applyFilters(){

    const search =
        document
            .getElementById(
                "searchBox"
            )
            .value
            .trim()
            .toLowerCase();


    let results =
        allProducts;


    /* CATEGORY */

    if(
        currentCategory !==
        "All"
    ){

        results =
            results.filter(
                product =>
                    product.category
                        .toLowerCase() ===
                    currentCategory
                        .toLowerCase()
            );

    }


    /* SEARCH */

    if(search){

        results =
            results.filter(
                product =>

                    product.name
                        .toLowerCase()
                        .includes(search)

                    ||

                    product.category
                        .toLowerCase()
                        .includes(search)

            );

    }


    document.getElementById(
        "status"
    ).style.display =
        "none";


    displayProducts(
        results
    );

}


/* =========================================
   COMPARE
========================================= */

function toggleCompare(
    productId
){

    const product =
        allProducts.find(
            p =>
                p.id === productId
        );


    if(!product){

        return;

    }


    const existing =
        selectedProducts.findIndex(
            p =>
                p.id === productId
        );


    if(existing >= 0){

        selectedProducts.splice(
            existing,
            1
        );

    }else{


        if(
            selectedProducts.length >= 3
        ){

            alert(
                "You can compare maximum 3 products."
            );

            return;

        }


        selectedProducts.push(
            product
        );

    }


    updateCompareBar();


    /*
       Refresh current screen
    */

    const search =
        document
            .getElementById(
                "searchBox"
            )
            .value
            .trim();


    if(search){

        performSearch();

    }else{

        applyFilters();

    }

}


/* =========================================
   COMPARE BAR
========================================= */

function updateCompareBar(){

    const bar =
        document.getElementById(
            "compareBar"
        );


    const text =
        document.getElementById(
            "compareText"
        );


    if(
        selectedProducts.length === 0
    ){

        bar.style.display =
            "none";

    }else{

        bar.style.display =
            "block";


        text.innerText =
            selectedProducts.length +
            " product" +
            (
                selectedProducts.length > 1
                ? "s"
                : ""
            ) +
            " selected";

    }

}


/* =========================================
   SHOW COMPARE
========================================= */

function showCompare(){

    if(
        selectedProducts.length < 2
    ){

        alert(
            "Please select at least 2 products."
        );

        return;

    }


    let message =
        "BESTDEAL COMPARISON\n\n";


    selectedProducts.forEach(
        product => {


            const cheapestStore =
                product.stores.reduce(
                    (lowest,current) =>
                        current.price <
                        lowest.price
                        ? current
                        : lowest
                );


            message +=
                product.name +
                "\nBest Price: ₹" +
                cheapestStore.price
                    .toLocaleString("en-IN") +
                "\nStore: " +
                cheapestStore.name +
                "\n\n";

        }
    );


    alert(message);

}


/* =========================================
   CLEAR COMPARE
========================================= */

function clearCompare(){

    selectedProducts = [];


    updateCompareBar();


    const search =
        document
            .getElementById(
                "searchBox"
            )
            .value
            .trim();


    if(search){

        performSearch();

    }else{

        applyFilters();

    }

}


/* =========================================
   START
========================================= */

loadProducts();

</script>

</body>
</html>
